<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moishouse 464</title>

  <style>
    :root{
      --yellow:#ffe85c;
      --pink:#ff55c8;
      --purple:#ca73ff;
      --cyan:#50f0ff;
      --green:#64ffb4;
      --white:#ffffff;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      min-height:100%;
    }

    body{
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.05), transparent 22%),
        radial-gradient(circle at 12% 45%, rgba(255,255,255,.025), transparent 18%),
        radial-gradient(circle at 88% 60%, rgba(255,255,255,.025), transparent 18%),
        #000;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      padding:16px 14px 26px;
    }

    .page{
      width:min(100%, 535px);
    }

    /* LOGO */
    .brand{
      text-align:center;
      margin:0 0 15px;
    }

    .logo{
      width:240px;
      max-width:72vw;
      display:block;
      margin:0 auto 7px;
      filter:
        drop-shadow(0 0 3px rgba(255,255,255,.95))
        drop-shadow(0 0 11px rgba(255,255,255,.35));
    }

    .brand-name{
      margin-left:12px;
      font-size:22px;
      font-weight:700;
      letter-spacing:12px;
      color:#fff;
      text-shadow:0 0 9px rgba(255,255,255,.7);
    }

    .code-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:11px;
      margin-top:6px;
    }

    .code-line{
      width:54px;
      height:2px;
      background:var(--pink);
      border-radius:99px;
      box-shadow:
        0 0 4px var(--pink),
        0 0 10px var(--pink);
    }

    .code{
      font-size:18px;
      letter-spacing:8px;
      margin-left:8px;
      text-shadow:0 0 10px rgba(255,255,255,.8);
    }

    /* MENÚ */
    .menu{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .card{
      --accent:#fff;
      position:relative;
      min-height:112px;
      display:grid;
      grid-template-columns:112px 1fr 112px;
      align-items:center;
      text-decoration:none;
      color:#fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),
        #050505;
      border:2px solid var(--accent);
      border-radius:22px;
      padding:0 6px;
      overflow:hidden;
      box-shadow:
        0 0 5px var(--accent),
        0 0 15px color-mix(in srgb, var(--accent) 56%, transparent),
        inset 0 0 12px color-mix(in srgb, var(--accent) 25%, transparent);
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:16px;
      pointer-events:none;
      border:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      box-shadow:inset 0 0 18px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .card:hover,
    .card:focus-visible{
      transform:translateY(-2px) scale(1.01);
      outline:none;
      box-shadow:
        0 0 8px var(--accent),
        0 0 24px color-mix(in srgb, var(--accent) 70%, transparent),
        0 0 42px color-mix(in srgb, var(--accent) 28%, transparent),
        inset 0 0 14px color-mix(in srgb, var(--accent) 32%, transparent);
    }

    .yellow{--accent:var(--yellow)}
    .pink{--accent:var(--pink)}
    .purple{--accent:var(--purple)}
    .green{--accent:var(--green)}

    .icon-area{
      color:var(--accent);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:1;
    }

    .icon{
      width:72px;
      height:72px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.05;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:
        drop-shadow(0 0 2px currentColor)
        drop-shadow(0 0 7px currentColor);
    }

    .title{
      position:relative;
      z-index:1;
      text-transform:uppercase;
      font-weight:900;
      letter-spacing:.4px;
      text-align:center;
      line-height:1.05;
      font-size:25px;
      color:var(--accent);
      text-shadow:
        0 0 3px currentColor,
        0 0 10px currentColor;
    }

    .title.white{
      color:#fff;
      text-shadow:0 0 9px rgba(255,255,255,.6);
    }

    .title.compact{
      font-size:23px;
    }

    /* PIE */
    .footer{
      margin-top:18px;
      text-align:center;
    }

    .slogan{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:9px;
      text-transform:uppercase;
      font-weight:900;
      letter-spacing:.45px;
      font-size:12px;
    }

    .slogan .a{color:var(--yellow);text-shadow:0 0 7px var(--yellow)}
    .slogan .b{color:var(--pink);text-shadow:0 0 7px var(--pink)}
    .slogan .c{color:var(--purple);text-shadow:0 0 7px var(--purple)}
    .slogan .dot{color:#fff}

    .stroke{
      margin:7px auto 13px;
      width:142px;
      height:10px;
      display:block;
    }

    .contact-row{
      display:grid;
      grid-template-columns:1fr 1.25fr 1fr;
      align-items:stretch;
      gap:0;
      border-top:1px solid rgba(255,255,255,.08);
      padding-top:7px;
    }

    .contact-item{
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:4px 9px;
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      font-size:10px;
      line-height:1.18;
    }

    .contact-item + .contact-item{
      border-left:2px solid var(--pink);
      box-shadow:-3px 0 7px -4px var(--pink);
    }

    .contact-icon{
      width:34px;
      height:34px;
      flex:0 0 34px;
      fill:none;
      stroke:#fff;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 4px rgba(255,255,255,.5));
    }

    .contact-item.heart .contact-icon{
      width:43px;
      height:43px;
      flex-basis:43px;
      stroke:var(--pink);
      filter:
        drop-shadow(0 0 4px var(--pink))
        drop-shadow(0 0 8px rgba(255,85,200,.45));
    }

    .contact-text{
      text-align:left;
    }

    .instagram-text{
      font-size:10px;
      white-space:nowrap;
    }

    @media (max-width:550px){
      .logo{
        width:210px;
      }

      .brand-name{
        font-size:18px;
        letter-spacing:9px;
      }

      .card{
        grid-template-columns:88px 1fr 88px;
        min-height:100px;
      }

      .icon{
        width:59px;
        height:59px;
      }

      .title{
        font-size:20px;
      }

      .title.compact{
        font-size:18px;
      }

      .contact-item{
        font-size:8px;
        padding:4px 5px;
        gap:5px;
      }

      .contact-icon{
        width:28px;
        height:28px;
        flex-basis:28px;
      }

      .contact-item.heart .contact-icon{
        width:34px;
        height:34px;
        flex-basis:34px;
      }
    }

    @media (max-width:390px){
      body{
        padding-inline:9px;
      }

      .card{
        grid-template-columns:72px 1fr 72px;
        min-height:92px;
      }

      .icon{
        width:50px;
        height:50px;
      }

      .title{
        font-size:17px;
      }

      .title.compact{
        font-size:15px;
      }

      .contact-row{
        grid-template-columns:1fr;
      }

      .contact-item + .contact-item{
        border-left:0;
        border-top:1px solid rgba(255,85,200,.7);
      }

      .contact-item{
        justify-content:flex-start;
        padding:8px 24px;
        font-size:10px;
      }
    }
  </style>
</head>
