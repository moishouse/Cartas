<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moishouse 464</title>

  <style>
    :root{
      --yellow:#ffe85c;
      --pink:#ff55c8;
      --purple:#ca73ff;
      --cyan:#50f0ff;
      --green:#64ffb4;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      min-height:100%;
    }

    body{
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.035), transparent 18%),
        radial-gradient(circle at 85% 30%, rgba(255,255,255,.025), transparent 20%),
        #000;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      padding:12px 14px 28px;
    }

    .page{
      width:min(100%, 500px);
    }

    .brand{
      text-align:center;
      margin:8px 0 12px;
    }

    .logo{
      width:225px;
      max-width:72vw;
      height:auto;
      display:block;
      margin:0 auto 7px;
      filter:
        drop-shadow(0 0 3px rgba(255,255,255,.8))
        drop-shadow(0 0 10px rgba(255,255,255,.25));
    }

    .brand-name{
      margin-left:10px;
      font-size:20px;
      font-weight:700;
      letter-spacing:11px;
      color:#fff;
      text-shadow:0 0 9px rgba(255,255,255,.55);
    }

    .code{
      text-align:center;
      font-size:17px;
      letter-spacing:8px;
      margin:0 0 10px 8px;
      text-shadow:0 0 10px rgba(255,255,255,.75);
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      --accent:#fff;
      position:relative;
      min-height:102px;
      display:grid;
      grid-template-columns:105px 1fr 105px;
      align-items:center;
      text-decoration:none;
      color:#fff;
      background:#050505;
      border:2px solid var(--accent);
      border-radius:18px;
      padding:0 4px;
      overflow:hidden;
      box-shadow:
        0 0 5px var(--accent),
        0 0 13px color-mix(in srgb, var(--accent) 55%, transparent),
        inset 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent);
      transition:.2s ease;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:12px;
      pointer-events:none;
      box-shadow:inset 0 0 16px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .card:hover,
    .card:focus-visible{
      transform:translateY(-2px) scale(1.01);
      outline:none;
      box-shadow:
        0 0 8px var(--accent),
        0 0 22px color-mix(in srgb, var(--accent) 68%, transparent),
        0 0 38px color-mix(in srgb, var(--accent) 30%, transparent),
        inset 0 0 12px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .yellow{--accent:var(--yellow)}
    .pink{--accent:var(--pink)}
    .purple{--accent:var(--purple)}
    .cyan{--accent:var(--cyan)}
    .green{--accent:var(--green)}

    .icon-area{
      color:var(--accent);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:1;
    }

    .icon{
      width:67px;
      height:67px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.05;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:
        drop-shadow(0 0 2px currentColor)
        drop-shadow(0 0 7px currentColor);
    }

    .title{
      z-index:1;
      text-transform:uppercase;
      font-weight:800;
      letter-spacing:.6px;
      text-align:left;
      line-height:1.06;
      font-size:23px;
      text-shadow:0 0 9px rgba(255,255,255,.45);
    }

    .title.one-line{
      text-align:center;
      white-space:nowrap;
      font-size:20px;
    }

    .footer{
      margin-top:17px;
      text-align:center;
    }

    .slogan{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      text-transform:uppercase;
      font-weight:800;
      letter-spacing:.45px;
      font-size:12px;
    }

    .slogan .a{color:var(--yellow);text-shadow:0 0 7px var(--yellow)}
    .slogan .b{color:var(--pink);text-shadow:0 0 7px var(--pink)}
    .slogan .c{color:var(--cyan);text-shadow:0 0 7px var(--cyan)}
    .slogan .dot{color:#fff}

    .stroke{
      margin-top:7px;
      width:128px;
      height:10px;
    }

    @media (max-width:520px){
      .logo{
        width:185px;
      }

      .brand-name{
        font-size:16px;
        letter-spacing:8px;
        margin-left:8px;
      }

      .code{
        font-size:15px;
        letter-spacing:7px;
      }

      .card{
        grid-template-columns:82px 1fr 82px;
        min-height:92px;
      }

      .icon{
        width:55px;
        height:55px;
      }

      .title{
        font-size:18px;
      }

      .title.one-line{
        font-size:16px;
      }

      .slogan{
        font-size:10px;
        gap:6px;
      }
    }

    @media (max-width:370px){
      .card{
        grid-template-columns:70px 1fr 70px;
      }

      .icon{
        width:47px;
        height:47px;
      }

      .title{
        font-size:16px;
      }

      .title.one-line{
        font-size:14px;
      }
    }
  </style>
</head>
