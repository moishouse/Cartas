<!DOCTYPE html>

    }

      display: inline-block;
      padding: 15px 32px;
      border: 2px solid #50f0ff;

      color: #fff;
      background: #050505;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow:
        0 0 7px #50f0ff,
        inset 0 0 8px rgba(80,240,255,.3);
